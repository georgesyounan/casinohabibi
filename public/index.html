<!doctype html>
<html lang="en-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101713">
<title>Northplay Casino</title>
<link rel="stylesheet" href="/style.css">
<script type="module" src="/app.js"></script>
</head>
<body>
<header><div class="shell bar">
<a class="brand" href="/"><span aria-hidden="true">✧</span> NORTHPLAY</a>
<nav aria-label="Navigation"><a href="/#games" data-copy="lobby"></a><a href="/#play-safely" data-copy="playSafely"></a><a href="/admin" data-copy="admin"></a></nav>
<div class="actions"><button id="language" class="ghost" type="button"></button><button id="account" type="button" data-copy="signin"></button></div>
</div></header>
<div id="session-reminder" class="session-reminder shell" role="status" aria-live="polite" hidden></div>
<main id="lobby" class="shell">
<section class="hero">
<div class="hero-content"><p class="eyebrow" data-copy="sandbox"></p>
<h1 data-copy="headline"></h1><p data-copy="intro"></p>
<a class="button" href="#games" data-copy="browse"></a></div>
</section>
<section class="welcome-rail" aria-label="Key information"><div><span class="rail-mark">CAD</span><span data-copy="cadDisplay"></span></div><div><span class="rail-mark">EN / FR</span><span data-copy="twoLanguages"></span></div><div><span class="rail-mark">DEMO</span><span data-copy="simulatedOnly"></span></div></section>
<section id="games" class="games"><div class="section-title"><div><p class="eyebrow" data-copy="lobbyEyebrow"></p><h2 data-copy="games"></h2><p class="section-intro" data-copy="gamesIntro"></p></div></div>
<div id="catalog-controls" class="catalog-controls" hidden><label class="game-search"><span data-copy="searchGames"></span><input id="game-search" type="search" autocomplete="off"></label>
<div class="filters" id="filters"><button data-filter="all" data-copy="all" aria-pressed="true"></button><button data-filter="slots" data-copy="slots" aria-pressed="false"></button><button data-filter="table" data-copy="table" aria-pressed="false"></button><button data-filter="live" data-copy="live" aria-pressed="false"></button><button data-filter="favorites" data-copy="favorites" aria-pressed="false"></button></div></div>
<div id="catalog-empty" class="empty-state" hidden><span aria-hidden="true">✧</span><div><h3 data-copy="catalogEmptyTitle"></h3><p data-copy="catalogEmpty"></p></div></div><div id="catalog" class="cards"></div></section>
<section class="steps-section"><div class="section-heading"><p class="eyebrow" data-copy="simpleEyebrow"></p><h2 data-copy="simpleHeading"></h2><p data-copy="simpleIntro"></p></div>
<div class="steps-grid"><article class="info-card"><span class="step-number">01</span><h3 data-copy="stepOneTitle"></h3><p data-copy="stepOneText"></p></article><article class="info-card"><span class="step-number">02</span><h3 data-copy="stepTwoTitle"></h3><p data-copy="stepTwoText"></p></article><article class="info-card"><span class="step-number">03</span><h3 data-copy="stepThreeTitle"></h3><p data-copy="stepThreeText"></p></article></div></section>
<section id="play-safely" class="safety-section"><div class="safety-copy"><p class="eyebrow" data-copy="safetyEyebrow"></p><h2 data-copy="safetyHeading"></h2><p data-copy="safetyIntro"></p><button id="safety-controls" type="button" data-copy="safetyCta"></button></div>
<div class="safety-tools"><article><span aria-hidden="true">◷</span><div><h3 data-copy="breakTitle"></h3><p data-copy="breakText"></p></div></article><article><span aria-hidden="true">⌁</span><div><h3 data-copy="limitTitle"></h3><p data-copy="limitText"></p></div></article><article><span aria-hidden="true">◎</span><div><h3 data-copy="excludeTitle"></h3><p data-copy="excludeText"></p></div></article></div></section>
<section id="faq" class="faq-section"><div class="section-heading"><p class="eyebrow" data-copy="helpEyebrow"></p><h2 data-copy="faqTitle"></h2></div><div class="faq-list">
<details><summary data-copy="faqBalanceQuestion"></summary><p data-copy="faqBalanceAnswer"></p></details>
<details><summary data-copy="faqGamesQuestion"></summary><p data-copy="faqGamesAnswer"></p></details>
<details><summary data-copy="faqSafetyQuestion"></summary><p data-copy="faqSafetyAnswer"></p></details>
</div></section>
</main>
<main id="admin" class="shell admin" hidden>
<section id="staff-login"><h1 data-copy="staffLogin"></h1><p data-copy="staffLoginHelp"></p>
<form id="staff-login-form"><label><span data-copy="staffEmail"></span><input name="email" type="email" required autocomplete="username"></label>
<div class="password-field"><label for="staff-login-password" data-copy="staffPassword"></label><div class="password-control"><input id="staff-login-password" name="password" type="password" minlength="12" required autocomplete="current-password"><button type="button" class="ghost password-toggle" data-staff-password-toggle aria-label="Show password" aria-pressed="false" data-copy="showPassword"></button></div></div>
<label><span data-copy="mfaCode"></span><input name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code"><small data-copy="mfaLoginHint"></small></label>
<button type="submit" data-copy="staffSignIn"></button></form><p role="status" id="staff-login-status"></p></section>
<div id="admin-tools" hidden><div class="admin-session"><span id="staff-identity"></span><button type="button" id="staff-logout" class="ghost" data-copy="staffSignOut"></button></div>
<section class="tenant-admin" data-roles="operator_admin,operator_content"><h2 data-copy="tenantSettings"></h2><p data-copy="tenantSettingsHelp"></p>
<form id="tenant-config"><label><span data-copy="brandName"></span><input name="brandName" maxlength="48" required></label>
<label><span data-copy="accentColor"></span><input name="accentColor" type="color" required></label>
<label><span data-copy="supportEmail"></span><input name="supportEmail" type="email" maxlength="254"></label>
<div class="actions"><button type="button" id="load-config" data-copy="loadConfig"></button><button type="submit" data-copy="saveDraft"></button><button type="button" id="publish-config" class="ghost" data-copy="publishConfig"></button></div>
</form><p role="status" id="tenant-config-status"></p></section>
<section class="tenant-admin" data-roles="operator_admin"><h2 data-copy="staffManagement"></h2>
<form id="staff-create"><label><span data-copy="staffEmail"></span><input name="email" type="email" required autocomplete="off"></label><label><span data-copy="temporaryPassword"></span><input name="password" type="password" minlength="12" autocomplete="new-password"></label>
<label><span data-copy="staffRole"></span><select name="role"><option value="operator_admin" data-copy="roleAdmin"></option><option value="operator_content" data-copy="roleContent"></option><option value="operator_provider" data-copy="roleProvider"></option><option value="operator_support" data-copy="roleSupport"></option></select></label><button type="submit" data-copy="staffCreate"></button></form>
<p role="status" id="staff-status"></p><ul id="staff-list"></ul><button type="button" id="staff-audit-refresh" class="ghost" data-copy="staffAudit"></button><ul id="staff-audit"></ul></section>
<section class="tenant-admin" id="mfa-settings"><h2 data-copy="mfaTitle"></h2><p data-copy="mfaHelp"></p><button type="button" id="mfa-setup" data-copy="mfaSetup"></button><pre id="mfa-secret" hidden></pre>
<form id="mfa-verify"><label><span data-copy="mfaCode"></span><input name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required autocomplete="one-time-code"></label><button type="submit" data-copy="mfaEnable"></button><button type="button" id="mfa-disable" class="ghost" data-copy="mfaDisable"></button></form><p role="status" id="mfa-status"></p></section>
<section class="tenant-admin support-inbox" data-roles="operator_admin,operator_support"><h2 data-copy="supportInbox"></h2><p data-copy="supportInboxHelp"></p><button type="button" id="support-inbox-refresh" class="ghost" data-copy="supportRefresh"></button><div class="support-controls"><label><span data-copy="supportSearch"></span><input id="support-search" type="search" autocomplete="off"></label><label><span data-copy="supportFilter"></span><select id="support-filter"><option value="all" data-copy="supportFilterAll"></option><option value="open" data-copy="supportStatusOpen"></option><option value="answered" data-copy="supportStatusAnswered"></option><option value="closed" data-copy="supportStatusClosed"></option></select></label><label><span data-copy="supportComplaintFilter"></span><select id="support-complaint-filter"><option value="all" data-copy="supportComplaintAll"></option><option value="complaints" data-copy="supportComplaintOnly"></option><option value="requests" data-copy="supportNonComplaints"></option></select></label><label><span data-copy="supportPriority"></span><select id="support-priority-filter"><option value="all" data-copy="supportPriorityAll"></option><option value="low" data-copy="supportPriorityLow"></option><option value="normal" data-copy="supportPriorityNormal"></option><option value="high" data-copy="supportPriorityHigh"></option><option value="urgent" data-copy="supportPriorityUrgent"></option></select></label><label><span data-copy="supportAssigneeFilter"></span><select id="support-assignee-filter"><option value="all" data-copy="supportAssigneeAll"></option><option value="mine" data-copy="supportAssigneeMine"></option><option value="unassigned" data-copy="supportUnassigned"></option></select></label></div><p id="support-summary"></p><p role="status" id="support-inbox-status"></p><div id="support-tickets"></div><button type="button" id="support-load-more" class="ghost" data-copy="supportLoadMore" hidden></button></section>
<section id="provider-tools" data-roles="operator_admin,operator_provider">
<p class="eyebrow" data-copy="sandbox"></p><h1 data-copy="providers"></h1><p data-copy="adminIntro"></p>
<form id="provider">
<label><span data-copy="providerName"></span><input name="name" maxlength="64" autocomplete="off"></label>
<label><span data-copy="providerKey"></span><input name="key" type="password" maxlength="2048" autocomplete="off"></label>
<div class="actions"><button type="submit" data-copy="save"></button><button type="submit" value="list" class="ghost" data-copy="list"></button><button type="submit" value="audit" class="ghost" data-copy="audit"></button></div>
</form>
<p role="status" id="provider-status"></p><ul id="providers"></ul>
<section class="catalog-admin"><h2 data-copy="catalogSync"></h2><p data-copy="catalogSyncHelp"></p>
<div class="sample-catalog-panel"><p data-copy="sampleCatalogHelp"></p><button id="load-sample-catalog" type="button" class="ghost" data-copy="loadSampleCatalog"></button><p id="sample-catalog-status" role="status" aria-live="polite"></p></div>
<form id="catalog-sync"><label><span data-copy="providerName"></span><input name="name" maxlength="64" required autocomplete="off"></label>
<label><span data-copy="catalogFile"></span><input id="catalog-file" type="file" accept=".json,application/json"></label>
<label><span data-copy="catalogJson"></span><textarea name="games" rows="8" required spellcheck="false"></textarea></label><pre class="json-example" data-copy="catalogExample"></pre>
<p id="catalog-preview" role="status" aria-live="polite"></p><div class="actions"><button id="catalog-review" type="button" data-copy="catalogReview"></button><button type="submit" data-copy="sync"></button></div></form><p role="status" id="catalog-status"></p></section>
</section></div>
</main>
<footer><div class="shell footer-content"><div><span class="brand"><span aria-hidden="true">✧</span> NORTHPLAY</span><p data-copy="disclaimer"></p></div><nav aria-label="Footer"><a href="/#play-safely" data-copy="playSafely"></a><a href="/#faq" data-copy="faqTitle"></a><a id="support-link" data-copy="supportContact" hidden></a><a href="/admin" data-copy="admin"></a></nav></div></footer>
<dialog id="dialog"><button type="button" class="close ghost" id="close" aria-label="Close">×</button><div id="panel"></div><p id="status" role="status"></p></dialog>
</body></html>
